<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Entrar | MídiaHub</title>

  <style>
    :root {
      --cor-principal: #4f46e5;
      --cor-principal-escura: #3730a3;
      --cor-fundo: #f4f6fb;
      --cor-painel: #ffffff;
      --cor-texto: #172033;
      --cor-texto-secundario: #667085;
      --cor-borda: #e4e7ec;
      --cor-sucesso: #12b76a;
      --cor-erro: #b42318;
      --sombra: 0 8px 24px rgba(16, 24, 40, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--cor-fundo);
      color: var(--cor-texto);
      font-family: Arial, Helvetica, sans-serif;
    }

    .tela-login {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--cor-borda);
      border-radius: 16px;
      background: var(--cor-painel);
      box-shadow: var(--sombra);
      padding: 34px;
    }

    .login-logo {
      margin-bottom: 28px;
      color: var(--cor-principal);
      font-size: 28px;
      font-weight: 700;
      text-align: center;
    }

    .login-logo span {
      color: var(--cor-principal-escura);
    }

    .login-titulo {
      margin-bottom: 8px;
      font-size: 24px;
      text-align: center;
    }

    .login-subtitulo {
      margin-bottom: 24px;
      color: var(--cor-texto-secundario);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .campo {
      margin-bottom: 16px;
    }

    .campo label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .campo input {
      width: 100%;
      border: 1px solid var(--cor-borda);
      border-radius: 8px;
      outline: none;
      padding: 12px;
      color: var(--cor-texto);
      font-size: 14px;
    }

    .campo input:focus {
      border-color: var(--cor-principal);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
    }

    .botao {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: var(--cor-principal);
      color: #ffffff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      padding: 13px;
    }

    .botao:hover {
      background: var(--cor-principal-escura);
    }

    .botao:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .link {
      display: block;
      margin-top: 18px;
      color: var(--cor-principal);
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      text-decoration: none;
    }

    .link:hover {
      text-decoration: underline;
    }

    .mensagem {
      min-height: 22px;
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .mensagem.erro {
      color: var(--cor-erro);
    }

    .mensagem.sucesso {
      color: var(--cor-sucesso);
    }

    .oculto {
      display: none;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 26px 20px;
      }

      .login-titulo {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <main class="tela-login">
    <section class="login-card">
      <div class="login-logo">
        Mídia<span>Hub</span>
      </div>

      <div id="bloco-login">
        <h1 class="login-titulo">Entrar na plataforma</h1>

        <p class="login-subtitulo">
          Use seu e-mail e sua senha para acessar o sistema.
        </p>

        <form id="formulario-login">
          <div class="campo">
            <label for="email-login">E-mail</label>

            <input
              id="email-login"
              type="email"
              placeholder="seuemail@empresa.com"
              autocomplete="email"
              required
            >
          </div>

          <div class="campo">
            <label for="senha-login">Senha</label>

            <input
              id="senha-login"
              type="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >
          </div>

          <button id="botao-login" class="botao" type="submit">
            Entrar
          </button>
        </form>

        <a id="link-esqueci-senha" class="link" href="#">
          Esqueci minha senha
        </a>
      </div>

      <div id="bloco-recuperacao" class="oculto">
        <h1 class="login-titulo">Redefinir senha</h1>

        <p class="login-subtitulo">
          Informe seu e-mail para receber o link de recuperação.
        </p>

        <form id="formulario-recuperacao">
          <div class="campo">
            <label for="email-recuperacao">E-mail</label>

            <input
              id="email-recuperacao"
              type="email"
              placeholder="seuemail@empresa.com"
              autocomplete="email"
              required
            >
          </div>

          <button id="botao-recuperacao" class="botao" type="submit">
            Enviar link
          </button>
        </form>

        <a id="link-voltar-login" class="link" href="#">
          Voltar para o login
        </a>
      </div>

      <div id="bloco-nova-senha" class="oculto">
        <h1 class="login-titulo">Criar nova senha</h1>

        <p class="login-subtitulo">
          Digite e confirme sua nova senha.
        </p>

        <form id="formulario-nova-senha">
          <div class="campo">
            <label for="nova-senha">Nova senha</label>

            <input
              id="nova-senha"
              type="password"
              placeholder="Mínimo de 6 caracteres"
              autocomplete="new-password"
              minlength="6"
              required
            >
          </div>

          <div class="campo">
            <label for="confirmacao-senha">Confirmar nova senha</label>

            <input
              id="confirmacao-senha"
              type="password"
              placeholder="Digite a senha novamente"
              autocomplete="new-password"
              minlength="6"
              required
            >
          </div>

          <button class="botao" type="submit">
            Salvar nova senha
          </button>
        </form>
      </div>

      <div id="mensagem" class="mensagem"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      'https://anrwavvwxcaetmyjeqyf.supabase.co';

    const SUPABASE_PUBLIC_KEY =
      'sb_publishable_vi2OXKBT4vhODxFzvmb2eg_4yV83oH_';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLIC_KEY
    );

    const blocoLogin = document.getElementById('bloco-login');
    const blocoRecuperacao = document.getElementById('bloco-recuperacao');
    const blocoNovaSenha = document.getElementById('bloco-nova-senha');
    const mensagem = document.getElementById('mensagem');

    function mostrarMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = 'mensagem';

      if (tipo) {
        mensagem.classList.add(tipo);
      }
    }

    function mostrarBloco(blocoParaMostrar) {
      blocoLogin.classList.add('oculto');
      blocoRecuperacao.classList.add('oculto');
      blocoNovaSenha.classList.add('oculto');

      blocoParaMostrar.classList.remove('oculto');
      mostrarMensagem('');
    }

    async function verificarSessaoAtual() {
      const resultado = await supabaseClient.auth.getSession();

      if (resultado.error) {
        mostrarMensagem(
          'Não foi possível verificar a sessão.',
          'erro'
        );
        return;
      }

      if (resultado.data.session) {
        window.location.href = 'dashboard.html';
      }
    }

    document
      .getElementById('formulario-login')
      .addEventListener('submit', async function(evento) {
        evento.preventDefault();

        const email = document
          .getElementById('email-login')
          .value
          .trim();

        const senha = document
          .getElementById('senha-login')
          .value;

        const botao = document.getElementById('botao-login');

        botao.disabled = true;
        botao.textContent = 'Entrando...';
        mostrarMensagem('');

        const resultado =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: senha
          });

        botao.disabled = false;
        botao.textContent = 'Entrar';

        if (resultado.error) {
          console.error('Erro de autenticação:', resultado.error);

          mostrarMensagem(
            'Não foi possível entrar. Verifique seu e-mail e sua senha.',
            'erro'
          );

          return;
        }

        window.location.href = 'dashboard.html';
      });

    document
      .getElementById('link-esqueci-senha')
      .addEventListener('click', function(evento) {
        evento.preventDefault();
        mostrarBloco(blocoRecuperacao);
      });

    document
      .getElementById('link-voltar-login')
      .addEventListener('click', function(evento) {
        evento.preventDefault();
        mostrarBloco(blocoLogin);
      });

    document
      .getElementById('formulario-recuperacao')
      .addEventListener('submit', async function(evento) {
        evento.preventDefault();

        const email = document
          .getElementById('email-recuperacao')
          .value
          .trim();

        const botao = document.getElementById('botao-recuperacao');

        botao.disabled = true;
        botao.textContent = 'Enviando...';
        mostrarMensagem('');

        const resultado =
          await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin +
              window.location.pathname
          });

        botao.disabled = false;
        botao.textContent = 'Enviar link';

        if (resultado.error) {
          console.error(
            'Erro de recuperação:',
            resultado.error
          );

          mostrarMensagem(
            'Não foi possível enviar o link de recuperação.',
            'erro'
          );

          return;
        }

        mostrarMensagem(
          'Link enviado. Verifique seu e-mail e a pasta de spam.',
          'sucesso'
        );
      });

    document
      .getElementById('formulario-nova-senha')
      .addEventListener('submit', async function(evento) {
        evento.preventDefault();

        const novaSenha = document
          .getElementById('nova-senha')
          .value;

        const confirmacaoSenha = document
          .getElementById('confirmacao-senha')
          .value;

        if (novaSenha.length < 6) {
          mostrarMensagem(
            'A senha deve ter pelo menos 6 caracteres.',
            'erro'
          );

          return;
        }

        if (novaSenha !== confirmacaoSenha) {
          mostrarMensagem(
            'As senhas não são iguais.',
            'erro'
          );

          return;
        }

        const resultado =
          await supabaseClient.auth.updateUser({
            password: novaSenha
          });

        if (resultado.error) {
          console.error(
            'Erro ao atualizar senha:',
            resultado.error
          );

          mostrarMensagem(
            'Não foi possível alterar a senha.',
            'erro'
          );

          return;
        }

        mostrarMensagem(
          'Senha alterada com sucesso. Entrando...',
          'sucesso'
        );

        setTimeout(function() {
          window.location.href = 'dashboard.html';
        }, 1200);
      });

    supabaseClient.auth.onAuthStateChange(function(
      evento,
      sessao
    ) {
      if (evento === 'PASSWORD_RECOVERY') {
        mostrarBloco(blocoNovaSenha);
      }

      if (evento === 'SIGNED_IN' && sessao) {
        window.location.href = 'dashboard.html';
      }
    });

    verificarSessaoAtual();
  </script>
</body>
</html>
